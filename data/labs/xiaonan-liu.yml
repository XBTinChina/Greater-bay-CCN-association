description: >-
  Although people often conceive of memory as something static and unchanging, like an old
  photograph, our memories constantly change because of subsequent experience and learning. Some of
  these effects result in interference and a reduced ability to retrieve memories, but some can
  improve memory retrieval, such as studying information again before a test. The research in our
  lab employs behavioral studies, neuroimaging (EEG and fMRI), machine learning, and computational
  modeling to explore how memory is dynamically strengthened, altered, and integrated, as well as
  the brain structures that support these processes.
