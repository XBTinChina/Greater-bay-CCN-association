description: >-
  Our research investigates the origin and functional mechanisms of brain neural oscillations by
  integrating neuroelectrophysiological techniques across spatial scales of the human brain
  (single-cell recordings, local field potentials and scalp electroencephalographic activity). We
  combine these techniques across species (human, non-human primates and rodents) with cognitive
  behavioral analysis, clinical pathology and computational modeling, and apply our findings to the
  early screening, diagnosis, therapeutic intervention and rehabilitation of neurological
  (Alzheimer's disease) and psychiatric disorders (depression, bipolar disorder, schizophrenia,
  ADHD).
