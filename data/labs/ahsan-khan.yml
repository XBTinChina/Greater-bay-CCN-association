description: >-
  How does the brain control what we remember, attend to, and feel? At the Cognitive Neuromodulation
  Laboratory, we investigate how cognitive control shapes memory, attention, and emotion, from
  suppressing unwanted memories to retrieving relevant experiences and regulating emotional
  responses. We combine non-invasive brain stimulation, EEG, MRI, and behavioural experiments to
  uncover, and causally test, the brain networks behind these abilities.
