description: >-
  Episodic memory (EM) lets us rapidly encode and later retrieve information from a single exposure,
  yet how the brain uses EM to support cognition and what rational strategies exist for coordinating
  different systems of learning and memory remains unclear. To answer these questions, we use neural
  networks as model organisms to reverse-engineer the memory architecture of the human brain, and
  test their predictions with human behavioral and neuroimaging experiments.
