description: >-
  We study how the brain uses rhythmic and temporal cues to make sense of complex sounds: how
  listeners segment speech and music into phrases, how they anticipate what comes next, and how the
  auditory-motor pathway supports both. We work with MEG, EEG, psychophysics and recurrent neural
  network models, and we are interested in what rhythm-based methods can offer speech and language
  disorders.
looking_for: PhD students, postdocs and research assistants interested in auditory neuroscience, music cognition or computational modelling
