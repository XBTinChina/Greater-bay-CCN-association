description: >-
  We use methods from psychophysics, EEG, MRI, representational similarity analysis (RSA),
  reinforcement learning (RL), machine learning (ML), and artificial neural networks (ANNs) to study
  how humans integrate visual structure, categorical knowledge, and semantic information. We also
  compare the human visual system with deep neural networks to identify shared and distinct
  principles underlying representational formation and recognition decisions. This work connects to
  interdisciplinary research in cognitive neuroscience, artificial intelligence (AI), computer
  vision, multimodal representation, large language models (LLM), and brain-computer interfaces
  (BCI).
