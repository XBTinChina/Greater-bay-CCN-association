description: >-
  Our lab focuses on the mechanisms and technological applications of predictive coding in
  neuroscience and brain-inspired intelligence. The ability to detect “surprise” is fundamental to
  perception, learning, and adaptive behavior. In neuroscience, our lab investigates how the brain
  forms and communicates internal representations, and how these representations influence
  perception and prediction across different brain regions. In brain-inspired intelligence, we
  explore how predictive coding mechanisms can be integrated with spiking neural networks to improve
  the computational efficiency of large-scale neural models, while advancing their deployment on
  neuromorphic hardware.
looking_for: "Our group is continuously recruiting Postdoc, RA, and interns in the following areas:
