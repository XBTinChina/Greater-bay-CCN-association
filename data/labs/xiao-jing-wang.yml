description: >-
  Research in my group aims at understanding dynamical behavior and function of neural circuits.
  Using theoretical and modeling approaches, in close collaboration with experimentalists, we
  investigate the neural mechanisms and computational principles of cognitive processes, such as
  decision-making (how we make a choice among multiple options) and working memory (how our brain
  holds and manipulates information "online" in the absence of sensory stimulation).
