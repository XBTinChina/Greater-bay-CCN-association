# Network-wide settings. Edited by coordinators; validated at build time by
# src/lib/network.ts. Everything on the site that is not a lab, event,
# tutorial, position, news item or document comes from here.

name: Greater Bay Area Computational and Cognitive Neuroscience Network
short_name: GBA-CCN Network
acronym: GBA-CCN
name_native: 粤港澳大湾区计算神经科学与认知神经科学网络

# founding: hides the homepage counters while labs help develop the network.
# active: shows the homepage counters; change when the founding labs agree.
# seminar.proposed separately controls whether the usual slot is proposed.
stage: founding

tagline: >-
  Connecting researchers and labs studying brains, behaviour and computation
  across the Greater Bay Area.
tagline_native: 连接粤港澳大湾区研究大脑、行为与计算的研究人员和实验室，共享讲座、学习资源与合作机会。
pitch: >-
  Member labs take turns hosting seminars and share methods and training
  resources. Researchers at all career stages can take part, find collaborators
  and explore research opportunities.
mission: >-
  We bring together researchers and labs in computational and cognitive
  neuroscience across the Greater Bay Area. We organise seminars, share methods
  and training resources, and help people find collaborators and research
  opportunities.

# Shown as a thin line under the header on every page except the home page.
# Plain HTML allowed; site-relative links such as href="join/" are fixed up.
# Keep this invitation current; dated announcements belong in event entries.
status_banner: >-
  Researchers at all career stages are welcome.
  <a href="events/">Explore events</a> or <a href="join/">join as a lab</a>.

founded: 2026

# General contact for nominations and the announcement list. Lab applications
# go to the Membership coordinator below, falling back to this address.
contact_email: ""

# One-step subscription page for the announcement list, when one exists.
# Without one, subscription links use the contact address or event listings.
mailing_list_url: https://buttondown.com/gba-ccn

repo_url: https://github.com/XBTinChina/Greater-bay-CCN-association

seminar:
  # Interpolated raw by slotLine in src/lib/network.ts into the home page, the
  # About page and the events index, so keep it a bare noun phrase with no
  # trailing punctuation: the frames append "." and ", on Zoom".
  slot: Second Friday of every month, 16:00–17:00 Hong Kong Time (UTC+8)
  # true while the slot awaits confirmation, which makes slotLine print
  # "Proposed: ..., subject to confirmation by the member labs". False since
  # the coordinators settled the slot in September 2026; the format is still
  # for the founding labs to agree.
  proposed: false
  platform: Zoom
  fallback_platform: Tencent Meeting (VooV)
  recording_note: >-
    Talks are recorded and posted to Bilibili and YouTube only with the
    speaker's written consent, given before the talk.

# Coordinators rotate. One per participating institution where possible.
# During the founding stage this list is the interim coordinator(s); founding
# conveners are added here as they confirm.
#
# role is the coloured chip on the About page, so keep it to two or three
# words; role_detail is the sentence under it. email is optional: a convener
# with none is reached through the issue tracker, which the page says.
coordinators:
  - name: Xiangbin Teng
    name_native: 滕相斌
    institution: The Chinese University of Hong Kong
    role: Site and repository
    role_detail: Interim coordinator; keeps this site, the data files and the repository
  - name: Qihong Lu
    name_native: 吕其鸿
    institution: City University of Hong Kong
    role: Seminars
    role_detail: The programme, the speakers and the hosting rotation
    email: qihong.lu@cityu.edu.hk
  - name: Jixing Li
    name_native: 李吉星
    institution: The Hong Kong Polytechnic University
    role: Membership
    role_detail: Lab applications, entries and the roster
    email: jixing.us@gmail.com
  - name: Chuanliang Han
    name_native: 韩传亮
    institution: Shenzhen University
    role: Outreach and Communications
    role_detail: Promotes the network and its activities to researchers and labs
    url: https://sites.google.com/view/neural-oscillation-lab

# Universities that formally co-host the seminar series. Add as agreed. There
# are twelve slots a year, so a list longer than twelve cannot give every
# co-host a turn in the same year.
host_institutions: []
