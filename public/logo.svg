<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GBA-CCN Network">
  <title>GBA-CCN Network</title>
  <rect width="64" height="64" rx="14" fill="#0e6f7c"/>
  <!-- three nodes, one per shore of the bay, linked -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M18 44 L32 20 L46 44 Z"/>
    <path d="M18 44 Q32 52 46 44"/>
  </g>
  <g fill="#ffffff">
    <circle cx="18" cy="44" r="5"/>
    <circle cx="32" cy="20" r="5"/>
    <circle cx="46" cy="44" r="5"/>
  </g>
</svg>
