# Speaker nomination form. Nominations are public issues reviewed by coordinators;
# the intake workflow creates no data file from them.
name: Speaker nomination
description: Suggest a seminar speaker in a public issue. Coordinators review nominations; they do not become website listings.
title: "[Speaker] "
labels: ["speaker-nomination"]
body:
  - type: markdown
    attributes:
      value: |
        Coordinators review nominations when planning seminars. Nominations are **public GitHub issues**, but are not displayed on the network website. Include only information you are comfortable sharing publicly.
  - type: input
    id: name
    attributes:
      label: Nominee
      placeholder: Jane Doe
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      placeholder: Southern University of Science and Technology
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Web page
      placeholder: https://example.org/doelab
  - type: input
    id: why
    attributes:
      label: Why this speaker (one line)
      placeholder: Recent work on predictive timing in auditory cortex that several member labs build on.
    validations:
      required: true
  - type: input
    id: suggested_host
    attributes:
      label: Suggested host lab
      placeholder: Teng Lab, CUHK
  - type: checkboxes
    id: willing_to_host
    attributes:
      label: Hosting
      options:
        - label: I am willing to host this talk
          required: false
  - type: textarea
    id: note
    attributes:
      label: Anything else
      description: Timing constraints, a talk you saw, a connection to the region.
