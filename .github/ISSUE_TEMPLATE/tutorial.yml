# Resource form; the existing filename and intake label remain compatible. Field ids and labels are mirrored in scripts/lib/forms.mjs;
# scripts/test-intake.mjs fails if the two drift apart.
name: Resource
description: Share a dataset, course, video, paper collection, tool or other useful learning and reference material.
title: "[Resource] "
labels: ["intake", "intake:tutorial"]
body:
  - type: markdown
    attributes:
      value: |
        Recommend a useful public resource: a dataset, course, video, reading list, tool, guide or other learning and reference material. You do not need to be its author. Link to the original source and credit its authors, maintainers or curators.

        A coordinator reviews the submission before it appears on the website. The material stays on its original website.
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: An open EEG dataset, a neuroscience course or a curated reading list
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors (comma-separated)
      description: Credit the authors, data providers, organisations, maintainers or collection curators.
      placeholder: Jane Doe, Wei Zhang
    validations:
      required: true
  - type: input
    id: lab
    attributes:
      label: Lab id
      description: Optional. The file name in data/labs without .yml, for example xiangbin-teng.
      placeholder: jane-doe
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - notebook
        - slides
        - video
        - course
        - book
        - software
        - dataset
        - paper-collection
        - other
      default: 8
  - type: dropdown
    id: level
    attributes:
      label: Level
      description: Optional. Choose not-applicable for datasets, reference lists or materials without a teaching level.
      options:
        - introductory
        - intermediate
        - advanced
        - not-applicable
      default: 3
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Chinese
        - Bilingual
        - Other
  - type: input
    id: url
    attributes:
      label: Link to the material
      placeholder: https://github.com/doelab/ddm-tutorial
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: DOI
      description: Optional. Include an existing DOI for the resource.
      placeholder: 10.5281/zenodo.0000000
  - type: input
    id: topics
    attributes:
      label: Topics (1 to 8, comma-separated)
      placeholder: decision making, Bayesian inference, Python
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description (max 700 characters)
      description: What it contains, who may find it useful, and any access, licence or prerequisite information.
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: The link points to a publicly accessible source, and the authors or curators are credited
          required: true
